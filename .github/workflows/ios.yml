name: Build iOS

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - 'windows/**'
      - '.github/workflows/ios.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: |
          swift scripts/icon.swift
          xcodegen generate
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Build simulator target
        run: |
          xcodebuild -project ios/LunaRemote.xcodeproj \
            -scheme LunaRemote \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
          CODE_SIGNING_ALLOWED=NO build
      - name: Install and launch in simulator
        run: |
          DEVICE=$(xcrun simctl create LunaSmoke com.apple.CoreSimulator.SimDeviceType.iPhone-16)
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/DerivedData/Build/Products/Debug-iphonesimulator/LunaRemote.app
          xcrun simctl launch "$DEVICE" com.luna.remote
          sleep 5
          xcrun simctl io "$DEVICE" screenshot build/LunaRemote-launch.png
          xcodebuild test -project ios/LunaRemote.xcodeproj \
            -scheme LunaRemote -destination "platform=iOS Simulator,id=$DEVICE" \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        with:
          name: LunaRemote-simulator
          path: build/LunaRemote-launch.png
          if-no-files-found: error

  unsigned-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Generate Xcode project
        working-directory: ios
        run: |
          swift scripts/icon.swift
          xcodegen generate
      - name: Archive unsigned device build
        run: |
          xcodebuild archive \
            -project ios/LunaRemote.xcodeproj \
            -scheme LunaRemote \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/LunaRemote.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
      - name: Package unsigned IPA
        run: |
          mkdir -p build/unsigned/Payload
          cp -R build/LunaRemote.xcarchive/Products/Applications/LunaRemote.app build/unsigned/Payload/
          cd build/unsigned
          zip -r ../LunaRemote-unsigned.ipa Payload
      - name: Validate device IPA
        run: python3 ios/scripts/validate_ipa.py build/LunaRemote-unsigned.ipa > build/ipa-validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: LunaRemote-unsigned-ipa
          path: |
            build/LunaRemote-unsigned.ipa
            build/ipa-validation.json
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Windows package
        shell: pwsh
        run: ./windows/startup/Build-Package.ps1 -Destination ./build/LunaRemote-Windows
      - name: Test input and streaming protocol
        shell: pwsh
        run: |
          & ./build/LunaRemote-Windows/agent/LunaRemoteAgent.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./build/LunaRemote-Windows/service/LunaRemoteStartup.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: LunaRemote-Windows
          path: build/LunaRemote-Windows
          if-no-files-found: error
