name: Build iOS

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Build simulator target
        run: |
          xcodebuild -project ios/LunaRemote.xcodeproj \
            -scheme LunaRemote \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build

  archive:
    if: ${{ secrets.APPSTORE_ISSUER_ID != '' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$P12_BASE64" | base64 --decode > signing.p12
          security create-keychain -p runner build.keychain
          security import signing.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security list-keychains -s build.keychain
          security unlock-keychain -p runner build.keychain
      - name: Archive
        run: |
          xcodebuild -project ios/LunaRemote.xcodeproj \
            -scheme LunaRemote \
            -configuration Release \
            -archivePath build/LunaRemote.xcarchive archive
      - name: Export IPA
        run: xcodebuild -exportArchive -archivePath build/LunaRemote.xcarchive -exportPath build/export -exportOptionsPlist ios/ExportOptions.plist
      - uses: actions/upload-artifact@v4
        with:
          name: LunaRemote-ipa
          path: build/export/*.ipa
