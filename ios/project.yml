name: LunaRemote
options:
  bundleIdPrefix: com.luna
  deploymentTarget:
    iOS: '17.0'
targets:
  LunaRemote:
    type: application
    platform: iOS
    sources:
      - LunaRemote
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        GCSupportsControllerUserInteraction: true
        NSLocalNetworkUsageDescription: Conectar ao seu Windows e controlar a tela pela rede local.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.luna.remote
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_VERSION: 5.0
      CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: Simulator.entitlements
      MARKETING_VERSION: 0.6.0
      CURRENT_PROJECT_VERSION: 13
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      TARGETED_DEVICE_FAMILY: '1,2'
      INFOPLIST_KEY_CFBundleDisplayName: Luna Remote
      INFOPLIST_KEY_UIRequiresFullScreen: true
      INFOPLIST_KEY_NSLocalNetworkUsageDescription: Luna Remote precisa encontrar seu computador Windows na rede local.
  LunaRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: LunaRemote
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.luna.remote.tests
  LunaRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: LunaRemote
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.luna.remote.uitests
schemes:
  LunaRemote:
    build:
      targets:
        LunaRemote: all
    test:
      targets:
        - LunaRemoteTests
        - LunaRemoteUITests
